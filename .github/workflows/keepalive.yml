name: Keepalive Workflow

on:
  schedule:
    - cron: '0 0 1,15 * *' # 每半个月自动检查一次
  workflow_dispatch:       # 支持手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
